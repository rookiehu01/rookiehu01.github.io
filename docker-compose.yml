version: "3.9"

services:
  backend:
    build: ./backend
    container_name: blog-backend
    env_file:
      - ./backend/.env
    ports:
      - "8282:8282"
    restart: unless-stopped
    networks:
      - nginx-proxy-network

  frontend:
    build: ./frontend
    container_name: blog-frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    external: true
